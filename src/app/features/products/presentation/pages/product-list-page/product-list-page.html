<section class="product-list-page">
  <div class="product-list-page__container">
    <!-- Barra superior -->
    <div class="product-list-page__toolbar">
      <!-- Buscador -->
      <div class="product-list-page__search">
        <app-input-field
          placeholder="Buscar..."
          iconLabel="Buscar productos"
          [(value)]="searchTerm"
        />
      </div>

      <!-- Agregar -->
      <div class="product-list-page__add">
        <app-custom-button variant="primary" routerLink="/products/new">
          Agregar
        </app-custom-button>
      </div>
    </div>

    <!-- Tabla -->
    <app-data-table
      [columns]="columns"
      [rows]="filteredProducts()"
      [loading]="loading()"
      [actions]="tableActions"
      [errorMessage]="loadError()"
      [pageSizeOptions]="[5, 10, 20]"
      [pageSize]="5"
    >
      <!-- Logo -->
      <ng-template tableCell="logo" let-product>
        <app-image-avatar
          [src]="product.logo"
          [alt]="product.name"
          fallback="JG"
          maxWidth="100px"
          height="40px"
        />
      </ng-template>

      <!-- Fecha de liberación -->
      <ng-template tableCell="dateRelease" let-product>
        {{ product.dateRelease | displayDate }}
      </ng-template>

      <!-- Fecha de reestructuración -->
      <ng-template tableCell="dateRevision" let-product>
        {{ product.dateRevision | displayDate }}
      </ng-template>
    </app-data-table>
  </div>
</section>

<app-confirmation-dialog
  [open]="!!productToDelete()"
  [title]="deleteTitle()"
  [busy]="deleting()"
  [error]="deleteError()"
  pendingLabel="Eliminando…"
  (cancelled)="cancelDelete()"
  (confirmed)="confirmDelete()"
/>
