<section class="product-list-page">
    <div class="product-list-page__container">

        <!-- TODO: Agregar el buscador. -->

        <app-data-table [columns]="columns" [rows]="products()" [actions]="tableActions"
            [errorMessage]="loadError()"
            [pageSizeOptions]="[5, 10, 15, 20, 30]" [pageSize]="5">

            <!-- Logo -->
            <ng-template tableCell="logo" let-product>
                <app-image-avatar [src]="product.logo" [alt]="product.name" fallback="JG" maxWidth="100px" height="40px" />
            </ng-template>

            <!-- Fecha de liberación -->
            <ng-template tableCell="date_release" let-product>
                {{ product.date_release | date:'dd/MM/yyyy':'UTC' }}
            </ng-template>

            <!-- Fecha de reestructuración -->
            <ng-template tableCell="date_revision" let-product>
                {{ product.date_revision | date:'dd/MM/yyyy':'UTC' }}
            </ng-template>

        </app-data-table>

    </div>
</section>
