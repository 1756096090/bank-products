@if (label()) {
  <label class="input-field__label" [for]="fieldId()">{{ label() }}</label>
}
<div class="input-field">
  <input
    class="input-field__control"
    [id]="fieldId()"
    [class.input-field__control--invalid]="!!errorMessage()"
    [required]="required()"
    [readOnly]="readOnly()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.aria-label]="label() ? null : placeholder()"
    [attr.aria-invalid]="errorMessage() ? 'true' : null"
    [attr.aria-describedby]="
      errorMessage() ? fieldId() + '-error' : hint() ? fieldId() + '-hint' : null
    "
    [class.input-field__control--with-icon]="!!icon()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="isDisabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (icon(); as iconName) {
    <button
      type="button"
      class="input-field__icon-button"
      [disabled]="isDisabled()"
      [attr.aria-label]="iconLabel()"
      (click)="onIconClick()"
    >
      <mat-icon aria-hidden="true">{{ iconName }}</mat-icon>
    </button>
  }
</div>
@if (errorMessage()) {
  <p
    class="input-field__message input-field__message--error"
    [id]="fieldId() + '-error'"
    role="alert"
  >
    {{ errorMessage() }}
  </p>
} @else if (hint()) {
  <p class="input-field__message" [id]="fieldId() + '-hint'">{{ hint() }}</p>
}
