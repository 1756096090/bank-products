<app-input-field
  type="date"
  placeholder="Selecciona una fecha"
  [label]="label()"
  [hint]="hint()"
  [error]="errorMessage()"
  [disabled]="isDisabled()"
  [required]="required()"
  [readOnly]="readOnly()"
  [min]="min()"
  [max]="max()"
  [value]="value()"
  (valueChange)="updateValue($event)"
  (blurred)="onBlur()"
/>
